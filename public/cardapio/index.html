<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio | Sr. Dogão</title><style>:root{--y:#ffd600;--r:#d70b13;--d:#35100b;--c:#fffaf0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--c);color:var(--d)}header{background:var(--y);padding:12px 20px;position:sticky;top:0;z-index:5}.top{max-width:1150px;margin:auto;display:flex;align-items:center;gap:18px}.logo{width:120px;height:65px;object-fit:contain}.back{margin-left:auto;background:var(--r);color:#fff;text-decoration:none;padding:12px 20px;border-radius:24px;font-weight:800}.wrap{max-width:1150px;margin:auto;padding:32px 20px}.wrap h1{margin:0 0 5px}.cats{display:flex;gap:8px;overflow:auto;padding:18px 0}.cats button{border:0;padding:11px 16px;border-radius:22px;font-weight:800;white-space:nowrap;cursor:pointer}.cats button.active{background:var(--r);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{background:#fff;border-radius:18px;padding:14px;display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;box-shadow:0 6px 20px #4d160012}.item img{width:110px;height:95px;object-fit:contain;background:#fff6cf;border-radius:12px}.item h3{margin:0 0 5px}.item p{margin:0 0 8px;color:#765}.price{color:var(--r);font-weight:900}.add-wrap{position:relative;width:42px;height:42px}.add{border:0;background:var(--r);color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer}.qty-badge{position:absolute;right:-7px;top:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--y);color:var(--d);border:2px solid #fff;display:grid;place-items:center;font-size:12px;font-weight:900;box-shadow:0 2px 6px #0002}.cart-badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:5px;border-radius:999px;background:#fff;color:var(--r);font-size:12px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:80px 1fr auto}.item img{width:80px;height:72px}.logo{width:95px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="top"><a href="/"><img class="logo" src="/sr-dogao-logo.png"></a><b>Cardápio completo</b><a class="back" href="/carrinho/">🛒 Carrinho <span class="cart-badge" id="cartCount">0</span></a><a class="back" href="/">← Voltar</a></div></header><main class="wrap"><h1>Cardápio Sr. Dogão</h1><p>Escolha seus favoritos e adicione ao carrinho.</p><div class="cats" id="cats"></div><div class="grid" id="grid">Carregando cardápio...</div></main><script>
const db=supabase.createClient('https://dlccdfwteekecjiwybfr.supabase.co','sb_publishable_izc2on9Gie9UC5iCHSjaBQ_5ItuscE2');
const names={hotdogs:'Hot Dogs',hamburguer:'Hambúrguer',barca:'Na Barca',combos:'Combos',porcoes:'Porções',bebidas:'Bebidas',sobremesas:'Sobremesas',promocoes:'Promoções'};
let products=[],currentCat='';
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const getCart=()=>JSON.parse(localStorage.getItem('srdogao_cart')||'[]');
const saveCart=cart=>localStorage.setItem('srdogao_cart',JSON.stringify(cart));
const itemQty=name=>{const item=getCart().find(x=>x.name===name);return item?Number(item.qty)||0:0};
function updateCartCount(){
  const total=getCart().reduce((sum,item)=>sum+(Number(item.qty)||0),0);
  document.getElementById('cartCount').textContent=total;
}
function addProduct(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;
  const price=+(p.promo&&p.promo_price?p.promo_price:p.price);
  const cart=getCart();
  const existing=cart.find(x=>x.name===p.name);
  existing?existing.qty++:cart.push({name:p.name,price,qty:1});
  saveCart(cart);
  localStorage.removeItem('srdogao_last_order_completed');
  localStorage.removeItem('srdogao_last_order');
  localStorage.removeItem('srdogao_checkout');
  updateCartCount();
  render(currentCat);
}
function render(cat=''){
  currentCat=cat;
  document.getElementById('cats').innerHTML='<button class="'+(!cat?'active':'')+'" data-c="">Todos</button>'+Object.entries(names).map(([k,v])=>'<button class="'+(cat===k?'active':'')+'" data-c="'+k+'">'+v+'</button>').join('');
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const cat=b.dataset.c;const url=cat?'/cardapio/?categoria='+encodeURIComponent(cat):'/cardapio/';history.replaceState(null,'',url);render(cat)});
  const list=cat?products.filter(p=>p.category===cat):products;
  document.getElementById('grid').innerHTML=list.map(p=>{
    const qty=itemQty(p.name);
    return '<div class="item"><img src="'+p.image_url+'" alt="'+p.name+'"><div><h3>'+p.name+'</h3><p>'+p.description+'</p><div class="price">'+money(p.promo&&p.promo_price?p.promo_price:p.price)+'</div></div><div class="add-wrap">'+(qty?'<span class="qty-badge">'+qty+'</span>':'')+'<button class="add" type="button" data-id="'+p.id+'" aria-label="Adicionar '+p.name+'">+</button></div></div>';
  }).join('')||'<p>Nenhum produto disponível.</p>';
  document.querySelectorAll('.add').forEach(b=>b.onclick=()=>addProduct(b.dataset.id));
  updateCartCount();
}
async function load(){
  updateCartCount();
  const {data,error}=await db.from('srdogao_products').select('*').eq('available',true).order('display_order');
  if(error){document.getElementById('grid').innerHTML='<p>Não foi possível carregar o cardápio.</p>';return}
  products=data||[];
  const requested=new URLSearchParams(location.search).get('categoria')||'';
  render(names[requested]?requested:'');
}
window.addEventListener('storage',updateCartCount);
load();
</script></body></html>
