<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu pedido | Sr. Dogão</title><style>body{margin:0;background:#fff9ef;color:#341a14;font:16px system-ui,sans-serif}header{background:#ffe04c;padding:22px;text-align:center}main{max-width:580px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #ead9c7;border-radius:22px;padding:24px;box-shadow:0 8px 30px #44221110}button,a.btn{display:block;box-sizing:border-box;width:100%;padding:15px;border:0;border-radius:15px;background:#c72c25;color:white;text-align:center;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}.muted{color:#705a51}#detail{white-space:pre-wrap;line-height:1.7}a.back{color:#53251a;text-decoration:none;font-weight:700}</style></head><body><header><h1>🌭 Sr. Dogão</h1></header><main><a class="back" href="/">← Voltar ao início</a><section class="card"><h2>📦 Meu pedido</h2><p id="detail">Consultando seu pedido...</p><button id="refresh" type="button">Atualizar situação</button><a class="btn" href="/carrinho/" id="checkout" style="display:none">Voltar ao pagamento</a><p class="muted" id="notice"></p></section></main><script>
const detail=document.getElementById('detail'),notice=document.getElementById('notice'),checkout=document.getElementById('checkout');
let pending;try{pending=JSON.parse(localStorage.getItem('srdogao_pending_pix_order')||'null')}catch{}
async function check(){
 if(!pending?.id||!pending?.token){detail.textContent='Nenhum pedido recente encontrado neste aparelho.';notice.textContent='Para consultar pedidos feitos em outro aparelho, será necessário entrar no seu cadastro.';return}
 detail.textContent='Consultando pagamento com segurança...';
 try{
 const r=await fetch('/api/sr-dogao-pay/order-status?orderId='+encodeURIComponent(pending.id)+'&token='+encodeURIComponent(pending.token),{cache:'no-store'});if(!r.ok)throw Error('Consulta indisponível');
 const data=await r.json(),paid=['confirmed','received'].includes(data.payment_status)||data.order_status==='confirmed';
 detail.textContent='Pedido: '+pending.id.slice(0,8).toUpperCase()+'\nPagamento: '+(paid?'Confirmado':data.payment_status==='pending'?'Aguardando pagamento':data.payment_status==='not_created'?'Cobrança não gerada':data.payment_status||'Em análise')+'\nPedido: '+(data.order_status||'Em análise');
 if(paid){checkout.style.display='none';notice.textContent='Pagamento confirmado. O estabelecimento recebeu a atualização.';localStorage.setItem('srdogao_last_order_completed','1')}
 else{checkout.style.display='block';notice.textContent='Não gere outro pedido nem pague novamente se já realizou o Pix. Se o QR Code não aparecer no carrinho, contate o estabelecimento.'}
 }catch{detail.textContent='Não foi possível consultar o pedido agora.';notice.textContent='Tente atualizar daqui a pouco. Não faça outro pagamento.'}
}
document.getElementById('refresh').onclick=check;check();setInterval(check,15000);
</script></body></html>
