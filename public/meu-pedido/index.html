<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu pedido | Sr. Dogão</title><style>body{margin:0;background:#fff9ef;color:#341a14;font:16px system-ui,sans-serif}header{background:#ffe04c;padding:22px;text-align:center}main{max-width:580px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #ead9c7;border-radius:22px;padding:24px;box-shadow:0 8px 30px #44221110}button,a.btn{display:block;box-sizing:border-box;width:100%;padding:15px;border:0;border-radius:15px;background:#c72c25;color:white;text-align:center;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}.muted{color:#705a51}#detail{white-space:normal;line-height:1.6}.timeline{display:grid;gap:10px;margin:18px 0}.step{padding:12px 14px;border-radius:12px;background:#f4eee7;color:#705a51;border-left:4px solid #d7c8b9}.step.done{background:#e9f7ed;color:#1e7040;border-color:#26874c}.step.active{background:#fff3d6;color:#7d4a0d;border-color:#e8a620}.order-meta{font-size:14px;color:#705a51;margin:6px 0}.item-list{padding-left:20px;margin:8px 0 16px}.item-list li{margin:5px 0}a.back{color:#53251a;text-decoration:none;font-weight:700}</style></head><body><header><h1>🌭 Sr. Dogão</h1></header><main><a class="back" href="/">← Voltar ao início</a><section class="card"><h2>📦 Meus pedidos</h2><div id="history"></div><p id="detail">Consultando seu pedido...</p><button id="refresh" type="button">Atualizar situação</button><button id="recover" type="button" style="display:none;background:#e6a921;color:#311a10">Recuperar Pix para pagar</button><div id="pixArea"></div><p class="muted" id="notice"></p></section></main><script>
const history=document.getElementById('history'),detail=document.getElementById('detail'),notice=document.getElementById('notice'),recover=document.getElementById('recover'),pixArea=document.getElementById('pixArea');
let pending;try{pending=JSON.parse(localStorage.getItem('srdogao_pending_pix_order')||'null')}catch{}
async function loadHistory(){try{const r=await fetch('/api/customer-pin/orders',{cache:'no-store'});if(!r.ok){history.textContent='Para ver pedidos anteriores, entre com CPF e PIN no início do site.';return}const data=await r.json();history.replaceChildren();for(const order of data.orders||[]){const b=document.createElement('button');b.type='button';b.textContent='Pedido '+order.id.slice(0,8).toUpperCase()+' — '+(order.status==='confirmed'?'Confirmado':'Consultar');b.style.background=order.status==='confirmed'?'#277b4a':'#c72c25';b.onclick=()=>{pending={id:order.id,token:order.token};pixArea.replaceChildren();check()};history.appendChild(b)}}catch{history.textContent='Não foi possível carregar pedidos anteriores.'}}
async function check(){
 if(!pending?.id||!pending?.token){detail.textContent='Nenhum pedido recente encontrado neste aparelho.';notice.textContent='Para consultar pedidos feitos em outro aparelho, será necessário entrar no seu cadastro.';return}
 detail.textContent='Consultando pagamento com segurança...';
 try{
 const r=await fetch('/api/sr-dogao-pay/order-status?orderId='+encodeURIComponent(pending.id)+'&token='+encodeURIComponent(pending.token),{cache:'no-store'});if(!r.ok)throw Error('Consulta indisponível');
 const data=await r.json(),paid=['confirmed','received'].includes(data.payment_status)||data.order_status==='confirmed';
 const labels={pending_payment:'Aguardando pagamento',confirmed:'Pedido confirmado',preparing:'Em preparação',in_preparation:'Em preparação',preparation:'Em preparação',preparando:'Em preparação',ready:'Pronto para entrega',out_for_delivery:'A caminho',on_the_way:'A caminho',delivering:'A caminho',delivered:'Entregue',cancelled:'Cancelado',canceled:'Cancelado'};
 const status=String(data.order_status||'').toLowerCase();
 const stages=[['confirmed','Pedido confirmado'],['preparing','Em preparação'],['out_for_delivery','A caminho'],['delivered','Entregue']];
 const level={confirmed:0,preparing:1,in_preparation:1,preparation:1,preparando:1,ready:1,out_for_delivery:2,on_the_way:2,delivering:2,delivered:3}[status]??-1;
 const dateText=value=>{if(!value)return null;const d=new Date(value);return Number.isNaN(d.getTime())?null:d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})};
 const make=(tag,txt,cls)=>{const el=document.createElement(tag);el.textContent=txt;if(cls)el.className=cls;return el};
 detail.replaceChildren();
 detail.appendChild(make('h3','Pedido '+pending.id.slice(0,8).toUpperCase()));
 detail.appendChild(make('p','Pagamento: '+(paid?'Confirmado':data.payment_status==='pending'?'Aguardando pagamento':'Em análise'),'order-meta'));
 if(dateText(data.created_at))detail.appendChild(make('p','Realizado em: '+dateText(data.created_at),'order-meta'));
 if(data.order_timing==='scheduled'&&dateText(data.scheduled_for))detail.appendChild(make('p','Agendado para: '+dateText(data.scheduled_for),'order-meta'));
 if(Number.isFinite(Number(data.total)))detail.appendChild(make('p','Total: '+Number(data.total).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),'order-meta'));
 const products=Array.isArray(data.items)?data.items:[];
 if(products.length){detail.appendChild(make('h4','Itens do pedido'));const list=document.createElement('ul');list.className='item-list';for(const item of products){list.appendChild(make('li',(item.qty||item.quantity||1)+'× '+(item.name||'Produto')))}detail.appendChild(list)}
 detail.appendChild(make('h4','Acompanhamento'));
 if(!paid){detail.appendChild(make('div','Aguardando pagamento do Pix','step active'))}
 else if(status==='cancelled'||status==='canceled'){detail.appendChild(make('div','Pedido cancelado','step active'))}
 else{const timeline=document.createElement('div');timeline.className='timeline';for(let i=0;i<stages.length;i++){const [key,label]=stages[i];timeline.appendChild(make('div',(i<level?'✓ ':i===level?'● ':'○ ')+label,'step '+(i<level?'done':i===level?'active':'')))}detail.appendChild(timeline);if(level<0)detail.appendChild(make('p','Situação atual: '+(labels[status]||status||'Em análise'),'order-meta'))}

 if(paid){recover.style.display='none';pixArea.textContent='';notice.textContent='Pagamento confirmado. Acompanhe aqui a evolução do seu pedido.';localStorage.setItem('srdogao_last_order_completed','1')}
 else{recover.style.display=data.payment_status==='pending'?'block':'none';notice.textContent='Não gere outro pedido nem pague novamente se já realizou o Pix. Para recuperar o Pix pendente, contate o estabelecimento. A reabertura segura do QR Code ainda está sendo preparada.'}
 }catch{detail.textContent='Não foi possível consultar o pedido agora.';notice.textContent='Tente atualizar daqui a pouco. Não faça outro pagamento.'}
}
recover.onclick=async()=>{
 recover.disabled=true;recover.textContent='Consultando Pix existente...';pixArea.textContent='';
 try{
  const response=await fetch('/api/sr-dogao-pay/recover-pix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:pending.id,token:pending.token})});
  const result=await response.json();
  if(result.status==='paid'){notice.textContent='O Pix já foi recebido. Atualizando pedido...';await check();return}
  if(!response.ok||!result.copy_paste){notice.textContent='Não foi possível recuperar o Pix existente. Não gere outro pedido nem pague novamente se já pagou.';return}
  const title=document.createElement('h3');title.textContent='Pix do pedido';pixArea.appendChild(title);
  if(result.qr_code){const img=document.createElement('img');img.src='data:image/png;base64,'+result.qr_code;img.alt='QR Code Pix';img.style.cssText='display:block;max-width:230px;width:100%;margin:12px auto';pixArea.appendChild(img)}
  const code=document.createElement('textarea');code.readOnly=true;code.value=result.copy_paste;code.rows=4;code.style.cssText='width:100%;box-sizing:border-box;border-radius:12px;padding:10px';pixArea.appendChild(code);
  const copy=document.createElement('button');copy.textContent='Copiar código Pix';copy.onclick=async()=>{try{await navigator.clipboard.writeText(code.value);copy.textContent='Copiado!'}catch{code.select()}};pixArea.appendChild(copy);
  notice.textContent='Este é o Pix já vinculado ao pedido, não uma nova cobrança. Confirme no seu banco antes de pagar.';
 }catch{notice.textContent='Falha na consulta. Tente novamente mais tarde.'}
 finally{recover.disabled=false;recover.textContent='Recuperar Pix para pagar'}
};
document.getElementById('refresh').onclick=check;loadHistory();check();setInterval(check,15000);
</script></body></html>
