<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu pedido | Sr. Dogão</title><style>body{margin:0;background:#fff9ef;color:#341a14;font:16px system-ui,sans-serif}header{background:#ffe04c;padding:22px;text-align:center}main{max-width:580px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #ead9c7;border-radius:22px;padding:24px;box-shadow:0 8px 30px #44221110}button,a.btn{display:block;box-sizing:border-box;width:100%;padding:15px;border:0;border-radius:15px;background:#c72c25;color:white;text-align:center;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}.muted{color:#705a51}#detail{white-space:normal;line-height:1.6}.timeline{display:grid;gap:10px;margin:18px 0}.step{padding:12px 14px;border-radius:12px;background:#f4eee7;color:#705a51;border-left:4px solid #d7c8b9}.step.done{background:#e9f7ed;color:#1e7040;border-color:#26874c}.step.active{background:#fff3d6;color:#7d4a0d;border-color:#e8a620}.order-meta{font-size:14px;color:#705a51;margin:6px 0}.item-list{padding-left:20px;margin:8px 0 16px}.item-list li{margin:5px 0}a.back{color:#53251a;text-decoration:none;font-weight:700}</style></head><body><header><a href="/" aria-label="Sr. Dogão - voltar ao início"><img src="/sr-dogao-logo.png" alt="Sr. Dogão" style="display:block;width:160px;max-width:55vw;height:80px;object-fit:contain;margin:auto"></a></header><main><a class="back" href="/">← Voltar ao início</a><section class="card"><h2>📦 Meus pedidos</h2><div id="history"></div><p id="detail">Consultando seu pedido...</p><button id="refresh" type="button">Atualizar situação</button><button id="recover" type="button" style="display:none;background:#e6a921;color:#311a10">Recuperar Pix para pagar</button><div id="pixArea"></div><p class="muted" id="notice"></p></section></main><script>
function showDeliveryPin(container,pin){if(!/^\d{4}$/.test(String(pin||'')))return;const box=document.createElement('div');box.style.cssText='margin-top:12px;padding:12px;border-radius:10px;background:#fff9e9;border:1px solid #ead6a5';const heading=document.createElement('div');heading.style.cssText='font-size:12px;font-weight:800;letter-spacing:.3px';heading.textContent='CÓDIGO DE ENTREGA';box.appendChild(heading);const number=document.createElement('div');number.style.cssText='font-size:30px;font-weight:900;letter-spacing:7px;margin:3px 0';number.textContent=String(pin);box.appendChild(number);const hint=document.createElement('small');hint.textContent='Informe este código ao entregador somente ao receber o pedido, para confirmar a entrega.';box.appendChild(hint);container.appendChild(box)}
function trackingHeader(container,pin){const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap';const heading=document.createElement('h4');heading.textContent='Acompanhamento';heading.style.margin='12px 0';row.appendChild(heading);if(/^\d{4}$/.test(String(pin||''))){const code=document.createElement('span');code.style.cssText='font-size:12px;font-weight:800;color:#795012;background:#fff1cd;border-radius:9px;padding:7px 10px';code.textContent='Código de entrega: '+pin;row.appendChild(code)}container.appendChild(row)}
function trackingStages(status,arrived){const stages=['Pedido confirmado','Em preparação','A caminho','Seu pedido chegou','Entregue'];const levels={confirmed:0,preparing:1,in_preparation:1,preparation:1,preparando:1,ready:1,out_for_delivery:2,on_the_way:2,delivering:2,arrived:3,delivered:4};let level=levels[status]??0;if(arrived&&level>=2&&level<4)level=3;return {stages,level}}
const history=document.getElementById('history'),detail=document.getElementById('detail'),notice=document.getElementById('notice'),recover=document.getElementById('recover'),pixArea=document.getElementById('pixArea');
let pending;try{pending=JSON.parse(localStorage.getItem('srdogao_pending_pix_order')||'null')}catch{}
if(pending?.id)detail.textContent='Pedido '+pending.id.slice(0,8).toUpperCase()+' — carregando acompanhamento...';
async function loadHistory(){
 try{
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);let r;try{r=await fetch('/api/customer-pin/orders',{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}
  if(!r.ok){if(!pending?.id)history.textContent='Entre com CPF e PIN no início do site para consultar suas compras.';return}
  const data=await r.json(),orders=data.orders||[];
  history.replaceChildren();
  if(orders.length){
   const latest=orders[0];
   if(!pending?.id||pending.id!==latest.id){
    pending={id:latest.id,token:latest.token};
    detail.replaceChildren();
    const summary=document.createElement('div');
    const title=document.createElement('h3');title.textContent='Pedido '+latest.id.slice(0,8).toUpperCase();summary.appendChild(title);
    const status=document.createElement('p');status.className='order-meta';status.textContent='Pagamento: '+(latest.status==='confirmed'?'Confirmado':'Em acompanhamento');summary.appendChild(status);
    if(latest.created_at){const date=document.createElement('p');date.className='order-meta';date.textContent='Realizado em: '+new Date(latest.created_at).toLocaleString('pt-BR');summary.appendChild(date)}
    if(Number.isFinite(Number(latest.total))){const total=document.createElement('p');total.className='order-meta';total.textContent='Total: '+Number(latest.total).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});summary.appendChild(total)}
    if(Array.isArray(latest.items)&&latest.items.length){const label=document.createElement('h4');label.textContent='Itens do pedido';summary.appendChild(label);const list=document.createElement('ul');list.className='item-list';for(const item of latest.items){const li=document.createElement('li');li.textContent=(item.qty||item.quantity||1)+'× '+(item.name||'Produto');list.appendChild(li)}summary.appendChild(list)}
    const {stages,level}=trackingStages(latest.status,latest.arriving_notified_at);
    trackingHeader(summary,latest.delivery_pin);
    const timeline=document.createElement('div');timeline.className='timeline';
    stages.forEach((name,i)=>{const step=document.createElement('div');step.className='step '+(i<level?'done':i===level?'active':'');step.textContent=(i<level?'✓ ':i===level?'● ':'○ ')+name;if(latest.delivery_pin&&i===level&&level>=2&&level<4)showDeliveryPin(step,latest.delivery_pin);timeline.appendChild(step)});
    summary.appendChild(timeline);detail.appendChild(summary);detail.dataset.loaded='1';
    void check();
   }
  }else if(!pending?.id){history.textContent='Você ainda não tem compras registradas.'}
 }catch{if(!pending?.id)history.textContent='Não foi possível carregar suas compras.'}
}
let checkInProgress=false;
async function check(){
 if(checkInProgress)return;
 if(!pending?.id||!pending?.token){detail.textContent='Nenhum pedido recente encontrado neste aparelho.';notice.textContent='Para consultar pedidos feitos em outro aparelho, será necessário entrar no seu cadastro.';return}
 checkInProgress=true;
 if(!detail.dataset.loaded&&!detail.textContent.trim())detail.textContent='Consultando pagamento com segurança...';
 try{
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);let r;try{r=await fetch('/api/sr-dogao-pay/order-status?orderId='+encodeURIComponent(pending.id)+'&token='+encodeURIComponent(pending.token),{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!r.ok)throw Error('Consulta indisponível');
 const data=await r.json(),paid=['confirmed','received'].includes(data.payment_status)||data.order_status==='confirmed';
 const labels={pending_payment:'Aguardando pagamento',confirmed:'Pedido confirmado',preparing:'Em preparação',in_preparation:'Em preparação',preparation:'Em preparação',preparando:'Em preparação',ready:'Pronto para entrega',out_for_delivery:'A caminho',on_the_way:'A caminho',delivering:'A caminho',delivered:'Entregue',cancelled:'Cancelado',canceled:'Cancelado'};
 const status=String(data.order_status||'').toLowerCase();
 if(status==='delivered'){
  const deliveredAt=Date.parse(data.delivered_at||'');
  const recent=Number.isFinite(deliveredAt)&&Date.now()-deliveredAt<120000;
  detail.replaceChildren();
  const success=document.createElement('section');
  success.style.cssText='background:#e8f7ec;border:2px solid #299553;border-radius:18px;padding:22px 16px;margin:14px 0;text-align:center;color:#165d33';
  const checkmark=document.createElement('div');checkmark.textContent='✓';checkmark.style.cssText='display:grid;place-items:center;margin:0 auto 12px;width:66px;height:66px;border-radius:50%;background:#20854a;color:white;font-size:43px;font-weight:900';
  const heading=document.createElement('h2');heading.textContent=recent?'Pedido entregue!':'Entrega concluída';heading.style.margin='6px 0';
  const thanks=document.createElement('p');thanks.textContent=recent?'Obrigado pela preferência! Esperamos que aproveite seu pedido. Volte sempre ao Sr. Dogão!':'Este pedido foi entregue e permanece disponível no seu histórico.';
  success.append(checkmark,heading,thanks);
  detail.append(success);
  const reorder=document.createElement('a');reorder.href='/cardapio/';reorder.className='btn';reorder.textContent='Comprar novamente';detail.append(reorder);
  document.getElementById('refresh').style.display='none';
  recover.style.display='none';pixArea.replaceChildren();notice.textContent='';
  detail.dataset.loaded='1';
  localStorage.setItem('srdogao_last_order_completed','1');
  return;
 }
 document.getElementById('refresh').style.display='block';
 const tracking=trackingStages(status,data.arriving_notified_at);
 if(data.arriving_notified_at&&tracking.level===3){notice.textContent='O entregador informou que chegou ao endereço. Informe o código somente após receber seu pedido.';}
 const level=tracking.level;
 const dateText=value=>{if(!value)return null;const d=new Date(value);return Number.isNaN(d.getTime())?null:d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})};
 const make=(tag,txt,cls)=>{const el=document.createElement(tag);el.textContent=txt;if(cls)el.className=cls;return el};
 const updated=document.createDocumentFragment();
 updated.appendChild(make('h3','Pedido '+pending.id.slice(0,8).toUpperCase()));
 updated.appendChild(make('p','Pagamento: '+(paid?'Confirmado':data.payment_status==='pending'?'Aguardando pagamento':'Em análise'),'order-meta'));
 if(dateText(data.created_at))updated.appendChild(make('p','Realizado em: '+dateText(data.created_at),'order-meta'));
 if(data.order_timing==='scheduled'&&dateText(data.scheduled_for))updated.appendChild(make('p','Agendado para: '+dateText(data.scheduled_for),'order-meta'));
 if(Number.isFinite(Number(data.total)))updated.appendChild(make('p','Total: '+Number(data.total).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),'order-meta'));
 const products=Array.isArray(data.items)?data.items:[];
 if(products.length){updated.appendChild(make('h4','Itens do pedido'));const list=document.createElement('ul');list.className='item-list';for(const item of products){list.appendChild(make('li',(item.qty||item.quantity||1)+'× '+(item.name||'Produto')))}updated.appendChild(list)}
 trackingHeader(updated,paid?data.delivery_pin:null);
 if(!paid){updated.appendChild(make('div','Aguardando pagamento do Pix','step active'))}
 else if(status==='cancelled'||status==='canceled'){updated.appendChild(make('div','Pedido cancelado','step active'))}
 else{const timeline=document.createElement('div');timeline.className='timeline';for(let i=0;i<tracking.stages.length;i++){const label=tracking.stages[i];const step=make('div',(i<level?'✓ ':i===level?'● ':'○ ')+label,'step '+(i<level?'done':i===level?'active':''));if(data.delivery_pin&&i===level&&level>=2&&level<4)showDeliveryPin(step,data.delivery_pin);timeline.appendChild(step)}updated.appendChild(timeline);if(level<0)updated.appendChild(make('p','Situação atual: '+(labels[status]||status||'Em análise'),'order-meta'))}

 if(status==='delivered'){
  const success=document.createElement('section');
  success.style.cssText='background:#e8f7ec;border:2px solid #299553;border-radius:18px;padding:22px 16px;margin:14px 0;text-align:center;color:#165d33';
  const checkmark=document.createElement('div');checkmark.textContent='✓';checkmark.style.cssText='display:grid;place-items:center;margin:0 auto 12px;width:66px;height:66px;border-radius:50%;background:#20854a;color:white;font-size:43px;font-weight:900';
  const heading=document.createElement('h2');heading.textContent='Pedido entregue!';heading.style.margin='6px 0';
  const thanks=document.createElement('p');thanks.textContent='Obrigado pela preferência! Esperamos que aproveite seu pedido. Volte sempre ao Sr. Dogão!';
  const loyalty=document.createElement('p');loyalty.textContent='⭐ Continue participando do nosso programa de pontos e aproveite as recompensas disponíveis.';
  success.append(checkmark,heading,thanks,loyalty);
  updated.prepend(success);
 }
 detail.replaceChildren(updated);
 detail.dataset.loaded='1';
 if(paid){recover.style.display='none';pixArea.textContent='';notice.textContent=status==='delivered'?'Entrega concluída. Obrigado por comprar com o Sr. Dogão!':'Pagamento confirmado. Acompanhe aqui a evolução do seu pedido.';localStorage.setItem('srdogao_last_order_completed','1')}
 else{recover.style.display=data.payment_status==='pending'?'block':'none';notice.textContent='Não gere outro pedido nem pague novamente se já realizou o Pix. Para recuperar o Pix pendente, contate o estabelecimento. A reabertura segura do QR Code ainda está sendo preparada.'}
 }catch{if(!detail.dataset.loaded)detail.textContent='Não foi possível consultar o pedido agora.';notice.textContent='Falha ao atualizar. Tente novamente daqui a pouco.'}
 finally{checkInProgress=false}
}
recover.onclick=async()=>{
 recover.disabled=true;recover.textContent='Consultando Pix existente...';pixArea.textContent='';
 try{
  const response=await fetch('/api/sr-dogao-pay/recover-pix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:pending.id,token:pending.token})});
  const result=await response.json();
  if(result.status==='paid'){notice.textContent='O Pix já foi recebido. Atualizando pedido...';await check();return}
  if(!response.ok||!result.copy_paste){notice.textContent='Não foi possível recuperar o Pix existente. Não gere outro pedido nem pague novamente se já pagou.';return}
  const title=document.createElement('h3');title.textContent='Pix do pedido';pixArea.appendChild(title);
  if(result.qr_code){const img=document.createElement('img');img.src='data:image/png;base64,'+result.qr_code;img.alt='QR Code Pix';img.style.cssText='display:block;max-width:230px;width:100%;margin:12px auto';pixArea.appendChild(img)}
  const code=document.createElement('textarea');code.readOnly=true;code.value=result.copy_paste;code.rows=4;code.style.cssText='width:100%;box-sizing:border-box;border-radius:12px;padding:10px';pixArea.appendChild(code);
  const copy=document.createElement('button');copy.textContent='Copiar código Pix';copy.onclick=async()=>{try{await navigator.clipboard.writeText(code.value);copy.textContent='Copiado!'}catch{code.select()}};pixArea.appendChild(copy);
  notice.textContent='Este é o Pix já vinculado ao pedido, não uma nova cobrança. Confirme no seu banco antes de pagar.';
 }catch{notice.textContent='Falha na consulta. Tente novamente mais tarde.'}
 finally{recover.disabled=false;recover.textContent='Recuperar Pix para pagar'}
};
document.getElementById('refresh').onclick=check;loadHistory();if(pending?.id&&pending?.token)check();setInterval(check,15000);
</script></body></html>
