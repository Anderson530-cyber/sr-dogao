<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd600"><title>Meus pontos | Sr. Dogão</title><style>:root{--y:#ffd600;--r:#d70b13;--d:#35100b;--c:#fffaf0;--muted:#78635a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--c);color:var(--d)}a{text-decoration:none;color:inherit}header{background:var(--y);padding:10px 18px}.top{max-width:900px;margin:auto;display:flex;align-items:center;gap:18px}.logo{width:110px;height:60px;object-fit:contain}.back{margin-left:auto;background:var(--r);color:#fff;padding:11px 16px;border-radius:22px;font-weight:900}.wrap{max-width:720px;margin:auto;padding:34px 18px}.card{background:#fff;border:1px solid #ecded3;border-radius:22px;box-shadow:0 8px 28px #4d160012;padding:22px}.field{display:grid;gap:6px;margin:16px 0}.field label{font-weight:900}.field input{border:1px solid #ded1c6;border-radius:14px;padding:13px 14px;font-size:1rem}.btn{width:100%;border:0;background:var(--r);color:#fff;padding:14px 18px;border-radius:26px;font-weight:900;cursor:pointer}.result{display:none}.points{display:flex;align-items:center;justify-content:space-between;background:#fff6c9;border-radius:18px;padding:18px;margin:18px 0}.points strong{font-size:2.2rem;color:var(--r)}.history{margin-top:18px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #eee}.muted{color:var(--muted)}.note{margin-top:14px;background:#fff8db;border:1px solid #ecd77d;padding:13px;border-radius:14px}</style></head><body><header><div class="top"><a href="/"><img class="logo" src="/sr-dogao-logo.png" alt="Sr. Dogão"></a><b>Programa de pontos</b><a class="back" href="/">← Voltar</a></div></header><main class="wrap"><div class="card" id="login"><h1>Meus pontos</h1><p class="muted">Digite o telefone usado no cadastro do pedido.</p><div class="field"><label for="phone">Telefone</label><input id="phone" inputmode="tel" placeholder="(48) 99999-9999"></div><button class="btn" id="enter">Entrar</button><p id="error" class="muted"></p></div><div class="card result" id="result"><h1 id="name">Meus pontos</h1><div class="points"><span>Saldo atual</span><strong id="total">0</strong></div><p>A cada R$ 10,00 em compras você ganha 1 ponto.</p><div class="note">A regra de expiração dos pontos ainda está sendo configurada. Quando for definida, a data de validade aparecerá aqui.</div><div class="history"><h2>Histórico</h2><div id="history"></div></div><button class="btn" id="logout" style="margin-top:18px">Consultar outro telefone</button></div></main><script>const normalize=v=>(v||'').replace(/\D/g,'');const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);const getLoyalty=()=>JSON.parse(localStorage.getItem('srdogao_loyalty')||'{}');function show(){const key=normalize(document.getElementById('phone').value),data=getLoyalty()[key];if(!data){document.getElementById('error').textContent='Nenhum cadastro de pontos encontrado para este telefone.';return}document.getElementById('login').style.display='none';document.getElementById('result').style.display='block';document.getElementById('name').textContent=data.name?'Pontos de '+data.name:'Meus pontos';document.getElementById('total').textContent=data.points||0;document.getElementById('history').innerHTML=(data.history||[]).map(h=>'<div class="row"><span>'+new Date(h.date).toLocaleDateString('pt-BR')+'<br><small class="muted">'+money(h.amount)+'</small></span><b>+'+h.points+' ponto'+(h.points===1?'':'s')+'</b></div>').join('')||'<p class="muted">Nenhum lançamento ainda.</p>'}document.getElementById('enter').onclick=show;document.getElementById('phone').addEventListener('keydown',e=>{if(e.key==='Enter')show()});document.getElementById('logout').onclick=()=>{document.getElementById('result').style.display='none';document.getElementById('login').style.display='block';document.getElementById('phone').value='';document.getElementById('error').textContent=''};</script></body></html>
